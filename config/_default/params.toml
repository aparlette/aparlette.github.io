colorScheme = "blowfish"          # try: blowfish, avocado, fire, forest, princess, neon, bloody, terminal, marvel, noir, autumn, congo, slate
defaultAppearance = "light"
autoSwitchAppearance = true

enableSearch = true
enableCodeCopy = true
enableStructuredBreadcrumbs = true

mainSections = ["blog"]           # what "Recent" on the homepage pulls from

disableImageOptimization = false
highlightCurrentMenuArea = true
smartTOC = true

[header]
  layout = "fixed"                # basic, fixed, fixed-fill, fixed-gradient, fixed-fill-blur

[footer]
  showMenu = true
  showCopyright = true
  showThemeAttribution = true
  showAppearanceSwitcher = true
  showScrollToTop = true

# -- The scrolling homepage --
# profile layout renders: avatar + headline + links,
# then the body of content/_index.md,
# then the recent-articles list below it.
[homepage]
  layout = "profile"
  showRecent = false
  showRecentItems = 3
  showMoreLink = true
  showMoreLinkDest = "blog"
  cardView = true

[article]
  showDate = true
  showAuthor = false
  showBreadcrumbs = true
  showDraftLabel = true
  showEdit = false
  showHeadingAnchors = true
  showPagination = true
  showReadingTime = true
  showTableOfContents = true
  showTaxonomies = true
  showWordCount = false
  sharingLinks = ["facebook", "twitter", "email"]

[list]
  showBreadcrumbs = true
  showSummary = true
  showTableOfContents = false
  groupByYear = true
  cardView = true

[taxonomy]
  showTermCount = true

[firebase]
  # unused

[fathomAnalytics]
  # unused
