  - { file: parlette-studios-horizontal.svg, label: Horizontal, tile: light }
  - { file: parlette-studios-horizontal-reverse.svg, label: Horizontal, reverse, tile: dark }
  - { file: parlette-studios-badge.svg, label: Circle badge, tile: light }
  - { file: parlette-studios-badge-reverse.svg, label: Circle badge, reverse, tile: dark }
  - { file: parlette-studios-mark.svg, label: Mark, tile: light }
  - { file: parlette-studios-mark-reverse.svg, label: Mark, reverse, tile: dark }
  - { file: parlette-studios-mark-navy.svg, label: One colour, tile: light }
  - { file: parlette-studios-mark-white.svg, label: One colour, white, tile: dark }
icons:
  - { name: ps-software, label: Software }
