colorScheme = "parlette"
defaultAppearance = "light"
autoSwitchAppearance = true

enableSearch = true
enableCodeCopy = true
enableStructuredBreadcrumbs = true

mainSections = ["work"]

disableImageOptimization = false
highlightCurrentMenuArea = true
smartTOC = true

[header]
  layout = "fixed"

[footer]
  showMenu = true
  showCopyright = true
  showThemeAttribution = false
  showAppearanceSwitcher = true
  showScrollToTop = true

[homepage]
  layout = "page"     # the ledger is the landing page; no card grid
  showRecent = false

[article]
  showDate = false
  showAuthor = false
  showBreadcrumbs = true
  showHeadingAnchors = true
  showPagination = false
  showReadingTime = false
  showTableOfContents = false
  showTaxonomies = false
  showWordCount = false
  sharingLinks = []

[list]
  showBreadcrumbs = true
  showSummary = true
  showTableOfContents = false
  groupByYear = false
  cardView = false

[parlette]
  site = "studio"
