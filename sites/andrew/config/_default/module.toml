# Blowfish is pulled in as a Hugo Module (no submodule, no vendored files).
# Note the /v2 suffix — Blowfish's own go.mod declares that module path.
# Update the theme with:  hugo mod get -u github.com/nunocoracao/blowfish/v2
#
# `shared` is this repo's own module (../../shared), resolved by the `replace`
# directive in go.mod. Precedence runs site > shared > Blowfish, so anything
# here overrides the brand layer, and the brand layer overrides the theme.
[[imports]]
  path = "github.com/nunocoracao/blowfish/v2"

[[imports]]
  path = "github.com/aparlette/parlette-sites/shared"
